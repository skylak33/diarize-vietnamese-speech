sample_rate: 16000
embedding:
  window_sec: 1.5
  step_sec: 0.75
  min_segment_sec: 0.5
vad:
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 100
  speech_pad_ms: 30
clustering:
  method: ahc
  count_estimator: backend_default
  threshold: 0.65
  max_speakers: 10
postprocessing:
  centroid_merge:
    enabled: false
    similarity_threshold: 0.80
    max_small_cluster_size: 4
    similarity_margin: 0.05
  confidence_aware_merge:
    enabled: false
    centroid_similarity_threshold: 0.65
    cross_median_threshold: 0.25
    cross_lower_threshold: 0.10
    max_compactness_drop: 0.12
    min_similarity_margin: 0.02
    subsample_size: 32
    min_cluster_size: 2
evaluation:
  collar: 0.25
  skip_overlap: false
seed: 42
device: auto
