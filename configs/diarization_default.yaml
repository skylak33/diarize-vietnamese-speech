sample_rate: 16000
embedding:
  window_sec: 1.5
  step_sec: 0.75
  min_segment_sec: 0.5
vad:
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 100
  speech_pad_ms: 30
clustering:
  method: ahc
  threshold: 0.65
  max_speakers: 10
postprocessing:
  centroid_merge:
    enabled: false
    similarity_threshold: 0.80
    max_small_cluster_size: 4
    similarity_margin: 0.05
evaluation:
  collar: 0.25
  skip_overlap: false
seed: 42
device: auto
